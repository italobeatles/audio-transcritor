<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin webmaster@teresinasoft.com.br
    ServerName transcritor.teresinasoft.com.br

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/transcritor_error.log
    CustomLog ${APACHE_LOG_DIR}/transcritor_access.log combined

    SSLCertificateFile /etc/letsencrypt/live/transcritor.teresinasoft.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/transcritor.teresinasoft.com.br/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
